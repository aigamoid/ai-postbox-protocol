<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 900" width="1080" height="900" role="img" aria-labelledby="title desc">
<title id="title">作業の判断と、ログ作成の判断</title>
<desc id="desc">仕事をしてよいかと記録してよいかを分ける。ログを検証して現在の担当と状態を算出。claim後に再検索しても厳密排他ではない。closedでも新事実による再開・訂正、日次まとめ、参加記録などは独自の条件で記録できる。</desc>
<style>text { font-family: "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif; font-size: 14px; fill: #17202A; }
.title { font-size: 22px; font-weight: 700; } .h { font-size: 16px; font-weight: 700; }
.s { font-size: 12px; fill: #526173; } .blue { fill: #1D5BA6; } .red { fill: #A43229; }
.box { fill: #F5F7FA; stroke: #8E9AA8; stroke-width: 1.2; }
.trust { fill: #E8F0FA; stroke: #1D5BA6; stroke-width: 1.4; }
.warn { fill: #FFF2EE; stroke: #BE4E3B; stroke-width: 1.2; }
.good { fill: #EAF5EE; stroke: #397A50; stroke-width: 1.2; }
.line { fill: none; stroke: #526173; stroke-width: 1.5; }</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="#526173"/></marker></defs>
<rect width="1080" height="900" rx="12" fill="white"/>
<text x="30" y="44" class="title">作業の判断と、ログ作成の判断</text>
<text x="30" y="72" class="s">2つの判断を分けます。ログを書く許可は、仕事を実行する許可ではありません。</text>
<text x="30" y="115" class="h">A. 作業を始める前</text>
<text x="570" y="115" class="h">B. ログを書く前</text>
<rect x="30" y="138" width="480" height="148" rx="10" class="trust"/>
<text x="48" y="167" class="h">1. 下書きを検索・検証</text>
<text x="48" y="193" class="">属性・空の宛先・独立した本文・必須項目を確認。</text>
<text x="48" y="216" class="">返信／転送／引用は除外。不足はunknown。</text>
<text x="48" y="239" class="">unknownを完了・担当の根拠にしない。</text>
<text x="48" y="262" class="">履歴不足なら停止・確認。独立した許可は別。</text>
<path class="line" d="M270,286 L270,310" marker-end="url(#arrow)"/>
<rect x="30" y="312" width="480" height="170" rx="10" class="box"/>
<text x="48" y="341" class="h">2. 最新の案件状態・現在の担当を確認</text>
<text x="48" y="367" class="">closed → 同じ作業は繰り返さない。</text>
<text x="48" y="390" class="">新しい事実があれば再開を記録できる。</text>
<text x="48" y="413" class="">他のAIの有効なclaim → 同じ作業をしない。</text>
<text x="48" y="436" class="">他者へのhand-off → その相手に任せる。</text>
<path class="line" d="M270,482 L270,506" marker-end="url(#arrow)"/>
<rect x="30" y="508" width="480" height="148" rx="10" class="good"/>
<text x="48" y="537" class="h">3. 担当を取るならclaimを書き、再検索</text>
<text x="48" y="563" class="">競合が見つかればSPECの順序規則で判定。</text>
<text x="48" y="586" class="">負けた側は停止。不明確なら持ち主に確認。</text>
<text x="48" y="609" class="">重複不可の作業には別の排他策が必要。</text>
<rect x="570" y="138" width="480" height="148" rx="10" class="trust"/>
<text x="588" y="167" class="h">1. 記録モードの条件を確認</text>
<text x="588" y="193" class="">安全な作成経路、参加記録、30分間隔を確認。</text>
<text x="588" y="216" class="">初回joinは参加記録チェックの例外。</text>
<text x="588" y="239" class="">作成後も属性・宛先・形式を検証する。</text>
<path class="line" d="M810,286 L810,310" marker-end="url(#arrow)"/>
<rect x="570" y="312" width="480" height="170" rx="10" class="box"/>
<text x="588" y="341" class="h">2. ログの目的に合った条件を確認</text>
<text x="588" y="367" class="">他者のclaim中でも新情報のfyiは記録できる。</text>
<text x="588" y="390" class="">closedでも新事実による再開・訂正は可能。</text>
<text x="588" y="413" class="">参加／退出記録・日次まとめも別の用途。</text>
<text x="588" y="436" class="">claim取得や担当変更はSPECの状態規則に従う。</text>
<path class="line" d="M810,482 L810,506" marker-end="url(#arrow)"/>
<rect x="570" y="508" width="480" height="148" rx="10" class="good"/>
<text x="588" y="537" class="h">3. 独立した新規下書きを作る</text>
<text x="588" y="563" class="">宛先なし。返信・転送・引用なし。</text>
<text x="588" y="586" class="">既存案件のcase-idと件名を再利用。</text>
<text x="588" y="609" class="">Gmailではカスタムラベルを使わず検索。</text>
<rect x="30" y="690" width="1020" height="174" rx="10" class="warn"/>
<text x="48" y="719" class="h">claimの有効期限と競合の限界</text>
<text x="48" y="745" class="">現在の担当者が有効期間内に書いた最新ログから48時間未満だけ有効。</text>
<text x="48" y="768" class="">hand-off・closed・期限切れで解除。旧担当者の通常ログだけでは復活しない。</text>
<text x="48" y="791" class="">claim公開後の再検索でも、同時実行の競合を完全には防げません。</text>
<text x="48" y="814" class="">厳密な排他には、持ち主による担当指定・外部ロック・冪等な操作などが必要です。</text>
</svg>
