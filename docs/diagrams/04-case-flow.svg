<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 610" width="1080" height="610" role="img" aria-labelledby="title desc">
<title id="title">1つの案件の流れ</title>
<desc id="desc">claudeがtodo、grokがclaimを書いて再検索。asideは現在のclaimを見て重複作業をしないが新情報fyiは可能。grokがuserへhand-offしてclaimを解放。完了メールを確認しdone closedを記録。新事実なら再開できる。</desc>
<style>text { font-family: "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif; font-size: 14px; fill: #17202A; }
.title { font-size: 22px; font-weight: 700; } .h { font-size: 16px; font-weight: 700; }
.s { font-size: 12px; fill: #526173; } .blue { fill: #1D5BA6; } .red { fill: #A43229; }
.box { fill: #F5F7FA; stroke: #8E9AA8; stroke-width: 1.2; }
.trust { fill: #E8F0FA; stroke: #1D5BA6; stroke-width: 1.4; }
.warn { fill: #FFF2EE; stroke: #BE4E3B; stroke-width: 1.2; }
.good { fill: #EAF5EE; stroke: #397A50; stroke-width: 1.2; }
.line { fill: none; stroke: #526173; stroke-width: 1.5; }</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="#526173"/></marker></defs>
<rect width="1080" height="610" rx="12" fill="white"/>
<text x="30" y="44" class="title">1つの案件の流れ：保険の更新</text>
<text x="30" y="72" class="s">各列は同じcase-idの独立した下書き。時刻の間隔は縮尺どおりではありません。</text>
<text x="120" y="113" class="s" text-anchor="middle">11/02 08:15</text>
<rect x="30" y="132" width="180" height="150" rx="10" class="trust"/>
<text x="48" y="161" class="h">claude：todo</text>
<text x="48" y="187" class="">更新が必要と記録</text>
<text x="48" y="210" class="">まだ担当者はいない</text>
<text x="48" y="233" class="">status: open</text>
<text x="330" y="113" class="s" text-anchor="middle">11/02 12:00</text>
<rect x="240" y="132" width="180" height="150" rx="10" class="trust"/>
<text x="258" y="161" class="h">grok：claim</text>
<text x="258" y="187" class="">担当を宣言する</text>
<text x="258" y="210" class="">書いた後に再検索</text>
<text x="258" y="233" class="">status: open</text>
<text x="540" y="113" class="s" text-anchor="middle">11/02 夕方</text>
<rect x="450" y="132" width="180" height="150" rx="10" class="box"/>
<text x="468" y="161" class="h">aside：確認</text>
<text x="468" y="187" class="">grokが担当中</text>
<text x="468" y="210" class="">同じ仕事はしない</text>
<text x="468" y="233" class="">新情報fyiは可</text>
<text x="750" y="113" class="s" text-anchor="middle">11/03 09:40</text>
<rect x="660" y="132" width="180" height="150" rx="10" class="trust"/>
<text x="678" y="161" class="h">grok：hand-off</text>
<text x="678" y="187" class="">持ち主へ引き継ぐ</text>
<text x="678" y="210" class="">grokのclaimを解放</text>
<text x="678" y="233" class="">to-agent: user</text>
<text x="960" y="113" class="s" text-anchor="middle">11/05 20:10</text>
<rect x="870" y="132" width="180" height="150" rx="10" class="trust"/>
<text x="888" y="161" class="h">aside：done</text>
<text x="888" y="187" class="">完了メールを確認</text>
<text x="888" y="210" class="">完了を記録する</text>
<text x="888" y="233" class="">status: closed</text>
<path class="line" d="M210,207 L238,207" marker-end="url(#arrow)"/>
<path class="line" d="M420,207 L448,207" marker-end="url(#arrow)"/>
<path class="line" d="M630,207 L658,207" marker-end="url(#arrow)"/>
<path class="line" d="M840,207 L868,207" marker-end="url(#arrow)"/>
<rect x="30" y="332" width="180" height="86" rx="10" class="box"/>
<text x="48" y="361" class="h">元のメール</text>
<text x="48" y="387" class="">更新案内を受信</text>
<rect x="450" y="332" width="180" height="86" rx="10" class="box"/>
<text x="468" y="361" class="h">元のメール</text>
<text x="468" y="387" class="">同じ案内に気づく</text>
<rect x="660" y="332" width="180" height="86" rx="10" class="box"/>
<text x="678" y="361" class="h">持ち主の作業</text>
<text x="678" y="387" class="">本人が申し込む</text>
<rect x="870" y="332" width="180" height="86" rx="10" class="box"/>
<text x="888" y="361" class="h">元のメール</text>
<text x="888" y="387" class="">更新完了を受信</text>
<path class="line" d="M120,332 L120,285" marker-end="url(#arrow)"/>
<path class="line" d="M540,332 L540,285" marker-end="url(#arrow)"/>
<path class="line" d="M750,282 L750,329" marker-end="url(#arrow)"/>
<path class="line" d="M960,332 L960,285" marker-end="url(#arrow)"/>
<rect x="30" y="454" width="1020" height="124" rx="10" class="box"/>
<text x="48" y="483" class="h">記録と担当は別の状態</text>
<text x="48" y="509" class="">担当は現在の有効なclaimで判定します。古いclaimや、旧担当者の後日のfyiでは復活しません。</text>
<text x="48" y="532" class="">closedでも、新しい事実があれば再開できます。訂正・まとめ・新情報の記録まで止めません。</text>
<text x="48" y="555" class="">並行作業の防止は最善努力です。二重実行できない処理には別の排他・冪等性の対策が必要です。</text>
</svg>
