<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 760" width="1080" height="760" role="img" aria-labelledby="title desc">
<title id="title">セットアップの参加条件</title>
<desc id="desc">現版はSTOP。将来のリリースで持ち主の承認を得た後、信頼できる読み取り経路と下書き検証能力を確認。さらに安全な作成経路を確認できた場合だけlog mode。その他はread-onlyまたはinactive。</desc>
<style>text { font-family: "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif; font-size: 14px; fill: #17202A; }
.title { font-size: 22px; font-weight: 700; } .h { font-size: 16px; font-weight: 700; }
.s { font-size: 12px; fill: #526173; } .blue { fill: #1D5BA6; } .red { fill: #A43229; }
.box { fill: #F5F7FA; stroke: #8E9AA8; stroke-width: 1.2; }
.trust { fill: #E8F0FA; stroke: #1D5BA6; stroke-width: 1.4; }
.warn { fill: #FFF2EE; stroke: #BE4E3B; stroke-width: 1.2; }
.good { fill: #EAF5EE; stroke: #397A50; stroke-width: 1.2; }
.line { fill: none; stroke: #526173; stroke-width: 1.5; }</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="#526173"/></marker></defs>
<rect width="1080" height="760" rx="12" fill="white"/>
<text x="30" y="44" class="title">セットアップの参加条件</text>
<rect x="30" y="80" width="1020" height="80" rx="10" class="warn"/>
<text x="48" y="109" class="h">現在の版：STOP</text>
<text x="48" y="135" class="">未リリースのため、下書き作成・ルールカード保存を含め、セットアップしません。</text>
<text x="30" y="193" class="s">以下は、将来のリリースでSTOPが解除された後の流れです。</text>
<rect x="30" y="220" width="650" height="78" rx="10" class="box"/>
<text x="48" y="249" class="h">1. 持ち主に説明し、承認を得る</text>
<text x="48" y="275" class="">承認なし → 参加しない。</text>
<path class="line" d="M355,298 L355,324" marker-end="url(#arrow)"/>
<rect x="30" y="326" width="650" height="102" rx="10" class="box"/>
<text x="48" y="355" class="h">2. ログを読み、検証する能力はある？</text>
<text x="48" y="381" class="">下書き属性・全宛先・返信／転送・本文を確認できる。</text>
<text x="48" y="404" class="">属性や由来を推測せず、サービスの情報で検証する。</text>
<path class="line" d="M680,377 L730,377" marker-end="url(#arrow)"/>
<text x="705.0" y="370.0" class="s" text-anchor="middle">なし</text>
<rect x="732" y="326" width="318" height="102" rx="10" class="warn"/>
<text x="750" y="355" class="h">inactive</text>
<text x="750" y="381" class="">参加しない。</text>
<text x="750" y="404" class="">不足する能力を持ち主に説明。</text>
<path class="line" d="M355,428 L355,454" marker-end="url(#arrow)"/>
<text x="355.0" y="434.0" class="s" text-anchor="middle">あり</text>
<rect x="30" y="456" width="650" height="102" rx="10" class="box"/>
<text x="48" y="485" class="h">3. 安全な新規下書き作成経路もある？</text>
<text x="48" y="511" class="">空の宛先・独立した下書きを作れる。</text>
<text x="48" y="534" class="">信頼実行層が送信・更新・削除・設定変更を拒否する。</text>
<path class="line" d="M680,507 L730,507" marker-end="url(#arrow)"/>
<text x="705.0" y="500.0" class="s" text-anchor="middle">なし</text>
<rect x="732" y="456" width="318" height="102" rx="10" class="box"/>
<text x="750" y="485" class="h">書込みを拒否できる？</text>
<text x="750" y="511" class="">確認できればread-only。</text>
<text x="750" y="534" class="">確認できなければinactive。</text>
<path class="line" d="M355,558 L355,584" marker-end="url(#arrow)"/>
<text x="355.0" y="564.0" class="s" text-anchor="middle">あり</text>
<rect x="30" y="586" width="650" height="102" rx="10" class="trust"/>
<text x="48" y="615" class="h">log mode</text>
<text x="48" y="641" class="">名前を決め、参加記録の新規下書きを作る。</text>
<text x="48" y="664" class="">ルールカードを保存し、参加モード・見方・やめ方を報告。</text>
<text x="30" y="727" class="s">Gmailはラベルを使わず下書きを検索。OAuth scopeの許可範囲とtool操作の拒否は別々に確認します。</text>
</svg>
