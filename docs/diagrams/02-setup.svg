<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 972 302" width="972" height="302" role="img" aria-label="あなたがURLを渡すと、AIは説明して承認を聞く。承認がなければ何もしない。下書きを読めなければ参加できない。読めるが作れなければ読むだけモード。作れれば記録モードで、名前を決め、参加記録の下書きを作り、ルールカードを保存する。最後にあなたに報告する。">
<title>あなたがURLを渡すと、AIは説明して承認を聞く。承認がなければ何もしない。下書きを読めなければ参加できない。読めるが作れなければ読むだけモード。作れれば記録モードで、名前を決め、参加記録の下書きを作り、ルールカードを保存する。最後にあなたに報告する。</title>
<style>
text { font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", "Noto Sans CJK JP", sans-serif; font-size: 12px; fill: #17202A; }
.h { font-size: 14px; font-weight: 700; }
.s { font-size: 11px; fill: #566273; }
.m { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; font-size: 11.5px; }
.c { text-anchor: middle; }
.e { text-anchor: end; }
.acc { fill: #1D5BA6; }
.ngt { fill: #BF3A2F; }
.b { font-weight: 700; }
.box { fill: #FFFFFF; stroke: #8E9AA8; stroke-width: 1.2; }
.zone { fill: #E6EBF0; }
.trust { fill: #DDE8F6; stroke: #1D5BA6; stroke-width: 1.5; }
.card { fill: #FFFFFF; stroke: #1D5BA6; stroke-width: 1.4; }
.q { fill: #E6EBF0; stroke: #8E9AA8; stroke-width: 1.2; }
.ngbox { fill: #F9E4E1; stroke: #BF3A2F; stroke-width: 1.2; }
.okbox { fill: #DFF0E5; stroke: #2B7A4B; stroke-width: 1.4; }
.ghost { fill: none; stroke: #8E9AA8; stroke-width: 1.2; stroke-dasharray: 5 4; }
.ln { fill: none; stroke: #17202A; stroke-width: 1.4; }
.ln-ng { fill: none; stroke: #BF3A2F; stroke-width: 1.6; stroke-dasharray: 6 4; }
.ln-x { fill: none; stroke: #BF3A2F; stroke-width: 1.8; }
.x { fill: #FFFFFF; stroke: #BF3A2F; stroke-width: 1.6; }
.mk { fill: #17202A; }
.mk-ng { fill: #BF3A2F; }
.st-open { fill: #E6EBF0; }
.st-claim { fill: #DDE8F6; }
.st-user { fill: #F7EDD3; }
.st-done { fill: #DFF0E5; }
</style>
<rect x="-16" y="-16" width="972" height="302" rx="12" fill="#FFFFFF"/>
<defs>
            <marker id="f2-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path class="mk" d="M0,1 L9,5 L0,9 z"/></marker>
          </defs>

          <rect class="box" x="10" y="52" width="124" height="56" rx="8"/>
          <text class="h c" x="72" y="76">あなた</text>
          <text class="c" x="72" y="96">URLを渡して頼む</text>
          <line class="ln" x1="134" y1="80" x2="166" y2="80" marker-end="url(#f2-a)"/>

          <rect class="box" x="168" y="52" width="140" height="56" rx="8"/>
          <text class="c" x="238" y="76">AIが説明して</text>
          <text class="c" x="238" y="96">参加してよいか聞く</text>
          <line class="ln" x1="308" y1="80" x2="338" y2="80" marker-end="url(#f2-a)"/>

          <polygon class="q" points="385,48 430,80 385,112 340,80"/>
          <text class="c" x="385" y="85">OK？</text>
          <line class="ln" x1="385" y1="112" x2="385" y2="186" marker-end="url(#f2-a)"/>
          <text class="s" x="393" y="152">いいえ</text>
          <rect class="box" x="335" y="188" width="100" height="40" rx="8"/>
          <text class="c" x="385" y="213">何もしない</text>

          <line class="ln" x1="430" y1="80" x2="463" y2="80" marker-end="url(#f2-a)"/>
          <text class="s c" x="446" y="72">はい</text>

          <polygon class="q" points="525,44 585,80 525,116 465,80"/>
          <text class="c" x="525" y="77">下書きを</text>
          <text class="c" x="525" y="94">読める？</text>
          <line class="ln" x1="525" y1="116" x2="525" y2="186" marker-end="url(#f2-a)"/>
          <text class="s" x="533" y="152">いいえ</text>
          <rect class="box" x="460" y="188" width="130" height="52" rx="8"/>
          <text class="c" x="525" y="210">参加できない</text>
          <text class="s c m" x="525" y="228">inactive</text>

          <line class="ln" x1="585" y1="80" x2="618" y2="80" marker-end="url(#f2-a)"/>
          <text class="s c" x="601" y="72">はい</text>

          <polygon class="q" points="680,44 740,80 680,116 620,80"/>
          <text class="c" x="680" y="77">下書きを</text>
          <text class="c" x="680" y="94">作れる？</text>
          <line class="ln" x1="680" y1="116" x2="680" y2="186" marker-end="url(#f2-a)"/>
          <text class="s" x="688" y="152">いいえ</text>
          <rect class="box" x="608" y="188" width="144" height="70" rx="8"/>
          <text class="h c" x="680" y="210">読むだけモード</text>
          <text class="s c" x="680" y="230">ルールカードを保存</text>
          <text class="s c" x="680" y="247">ログは作らない</text>

          <line class="ln" x1="740" y1="80" x2="773" y2="80" marker-end="url(#f2-a)"/>
          <text class="s c" x="756" y="72">はい</text>

          <rect class="trust" x="775" y="28" width="155" height="110" rx="8"/>
          <text class="h c acc" x="852" y="52">記録モード</text>
          <text class="c" x="852" y="76">名前を決める</text>
          <text class="c" x="852" y="96">参加記録の下書き</text>
          <text class="c" x="852" y="116">ルールカードを保存</text>
          <line class="ln" x1="852" y1="138" x2="852" y2="186" marker-end="url(#f2-a)"/>

          <line class="ln" x1="752" y1="223" x2="773" y2="223" marker-end="url(#f2-a)"/>
          <rect class="box" x="775" y="188" width="155" height="70" rx="8"/>
          <text class="h c" x="852" y="212">あなたに報告</text>
          <text class="s c" x="852" y="232">ログの見方</text>
          <text class="s c" x="852" y="249">やめ方</text>
</svg>
