<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 690" width="1080" height="690" role="img" aria-labelledby="title desc">
<title id="title">全体の構成と操作の境界</title>
<desc id="desc">受信メールはログではない。下書きの属性・空の宛先・独立した本文を検証し、不足はunknown。信頼実行層で許可操作を限定し、Gmail OAuthだけでは送信や削除を遮断できない。</desc>
<style>text { font-family: "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif; font-size: 14px; fill: #17202A; }
.title { font-size: 22px; font-weight: 700; } .h { font-size: 16px; font-weight: 700; }
.s { font-size: 12px; fill: #526173; } .blue { fill: #1D5BA6; } .red { fill: #A43229; }
.box { fill: #F5F7FA; stroke: #8E9AA8; stroke-width: 1.2; }
.trust { fill: #E8F0FA; stroke: #1D5BA6; stroke-width: 1.4; }
.warn { fill: #FFF2EE; stroke: #BE4E3B; stroke-width: 1.2; }
.good { fill: #EAF5EE; stroke: #397A50; stroke-width: 1.2; }
.line { fill: none; stroke: #526173; stroke-width: 1.5; }</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="#526173"/></marker></defs>
<rect width="1080" height="690" rx="12" fill="white"/>
<text x="30" y="44" class="title">全体の構成と操作の境界</text>
<text x="30" y="72" class="s">未リリース。これは設計の説明であり、まだセットアップしません。</text>
<rect x="30" y="118" width="210" height="190" rx="10" class="box"/>
<text x="48" y="147" class="h">外部の差出人</text>
<text x="48" y="173" class="">会社のお知らせ</text>
<text x="48" y="196" class="">通常のメール／偽メール</text>
<text x="48" y="219" class="">メール本文は情報。</text>
<text x="48" y="242" class="">AIへの操作許可ではない。</text>
<rect x="290" y="118" width="330" height="148" rx="10" class="box"/>
<text x="308" y="147" class="h">受信メール</text>
<text x="308" y="173" class="">ログのような件名・本文でも</text>
<text x="308" y="196" class="">受信メールはログとして扱わない。</text>
<path class="line" d="M240,213 L290,213" marker-end="url(#arrow)"/>
<rect x="290" y="298" width="330" height="218" rx="10" class="trust"/>
<text x="308" y="327" class="h">下書きログを検証</text>
<text x="308" y="353" class="">下書き属性とTo・Cc・Bccを確認</text>
<text x="308" y="376" class="">宛先なし・独立した新規下書き</text>
<text x="308" y="399" class="">返信／転送／引用を除外</text>
<text x="308" y="422" class="">必須項目と値を確認</text>
<text x="308" y="445" class="">根拠が不足 → unknown</text>
<rect x="680" y="118" width="370" height="148" rx="10" class="good"/>
<text x="698" y="147" class="h">参加AIと信頼できる実行層</text>
<text x="698" y="173" class="">持ち主の承認と能力確認が必要。</text>
<text x="698" y="196" class="">許可：検索・閲覧・新規ログ作成</text>
<text x="698" y="219" class="">拒否：送信・更新・削除・設定変更</text>
<path class="line" d="M680,213 L620,213" marker-end="url(#arrow)"/>
<path class="line" d="M865,266 V282 H634 V407 H620" marker-end="url(#arrow)"/>
<text x="657" y="349" class="s" text-anchor="middle">閲覧</text>
<text x="657" y="374" class="s" text-anchor="middle">作成</text>
<rect x="680" y="298" width="370" height="218" rx="10" class="warn"/>
<text x="698" y="327" class="h">GmailのOAuthだけでは制限不可</text>
<text x="698" y="353" class="">下書き作成用scopeには、</text>
<text x="698" y="376" class="">送信・下書き削除も含まれる。</text>
<text x="698" y="399" class="">実行層で拒否を確認できなければ</text>
<text x="698" y="422" class="">安全なread-only経路を使う。</text>
<text x="698" y="445" class="">それもなければinactive。</text>
<rect x="30" y="548" width="1020" height="110" rx="10" class="box"/>
<text x="48" y="577" class="h">残る制約</text>
<text x="48" y="603" class="">下書きであることは作者・内容の証明ではありません。接続アプリによる改変もあり得ます。</text>
<text x="48" y="626" class="">制御の対象は確認済みのメール操作経路です。他ツールやAIサービスへのデータ提供は別の問題です。</text>
</svg>
